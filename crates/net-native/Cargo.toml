[package]
name = "harmion-net-native"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
tracing.workspace = true
thiserror.workspace = true
harmion-domain = { path = "../domain" }
harmion-node = { path = "../node" }
harmion-protocol = { path = "../protocol" }
harmion-local-web = { path = "../local-web" }
bytes = "1"
base64 = "0.22.1"
url = "2.5.8"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server", "client"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rcgen = { version = "0.14", default-features = false, features = ["ring", "crypto"] }
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
iroh = { version = "1.4.1", default-features = false, features = ["tls-ring"] }
netwatch = "0.19.3"
webpki-roots = "1"

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1.6", features = ["time"] }

[dev-dependencies]
iroh-relay = { version = "1.4.1", default-features = false, features = ["server", "tls-ring"] }
harmion-store-sqlite = { path = "../store-sqlite" }
harmion-client = { path = "../client" }
harmion-sdk-native = { path = "../client-ffi" }

[lints]
workspace = true
