[package]
name = "harmion-wiki-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "wiki-server"
path = "src/main.rs"

[dependencies]
clap.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
harmion-wiki-core = { path = "../../crates/wiki-core" }
harmion-client = { path = "../../crates/client" }
tokio = { version = "1", features = ["rt", "time", "net"] }

[lints]
workspace = true
