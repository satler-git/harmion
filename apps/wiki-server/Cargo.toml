[package]
name = "harmion-wiki-server"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "wiki-server"
path = "src/main.rs"

[dependencies]
base64 = "0.22.1"
clap.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
unicode-normalization = "0.1"
sha2 = "0.10"
harmion-wiki-core = { path = "../../crates/wiki-core" }
harmion-client = { path = "../../crates/client" }
tokio = { version = "1", features = ["rt", "time", "net"] }

[lints]
workspace = true
