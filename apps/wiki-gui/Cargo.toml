[package]
name = "harmion-wiki-gui"
version.workspace = true
edition.workspace = true
build = "build.rs"
license.workspace = true
publish = false

[[bin]]
name = "wiki-gui"
path = "src/main.rs"

[dependencies]
anti-webui = { git = "https://github.com/bea4dev/AntiWebUI", rev = "6908e3119db4ecf7080f57de59870e083f2cbc98", default-features = false, features = ["wayland", "x11", "svg", "svg-text", "code"] }
anti-webui-symbols-outlined = { git = "https://github.com/bea4dev/AntiWebUI", rev = "6908e3119db4ecf7080f57de59870e083f2cbc98" }
anti-webui-markdown = { git = "https://github.com/bea4dev/AntiWebUI", rev = "6908e3119db4ecf7080f57de59870e083f2cbc98", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
harmion-wiki-core = { path = "../../crates/wiki-core" }

[lints]
workspace = true
