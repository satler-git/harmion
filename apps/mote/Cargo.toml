[package]
name = "mote"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
base64 = "0.22.1"
clap.workspace = true
harmion-client = { path = "../../crates/client" }
harmion-local = { path = "../../crates/local" }
mote-core = { path = "../../crates/mote-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror.workspace = true
time = { version = "0.3.55", features = ["formatting", "local-offset", "macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }

[lints]
workspace = true
