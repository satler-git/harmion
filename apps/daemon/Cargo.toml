[package]
name = "harmiond"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
harmion-domain = { path = "../../crates/domain" }
harmion-protocol = { path = "../../crates/protocol" }
harmion-node = { path = "../../crates/node" }
harmion-store-sqlite = { path = "../../crates/store-sqlite" }
harmion-net-native = { path = "../../crates/net-native" }
harmion-local = { path = "../../crates/local" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }

[lints]
workspace = true
