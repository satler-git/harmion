[package]
name = "harmion-wiki-lsp"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "harmion_wiki_lsp"
path = "src/lib.rs"

[[bin]]
name = "wiki-lsp"
