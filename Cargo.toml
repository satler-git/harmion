[workspace]
members = ["crates/domain", "crates/wiki-core", "crates/protocol", "crates/node", "crates/store-sqlite", "crates/net-native", "crates/local", "crates/local-web", "crates/client", "crates/runtime", "crates/android", "crates/client-ffi", "crates/worker", "crates/mote-core", "apps/daemon", "apps/admin", "apps/cli", "apps/mote", "apps/mote-hud", "apps/wiki-server", "apps/wiki-gui", "apps/wiki-lsp"]
resolver = "3"

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "MIT"

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.lints.rust]
unsafe_code = "forbid"
