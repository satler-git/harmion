[workspace]
members = ["crates/domain", "crates/protocol", "crates/node", "crates/store-sqlite", "crates/net-native", "crates/local", "crates/local-web", "crates/client", "apps/daemon", "apps/admin", "apps/cli"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.lints.rust]
unsafe_code = "forbid"
